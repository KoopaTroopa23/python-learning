image: python:3.11

stages:
  - extract
  - test
  - deploy

run_etl:
  stage: extract
  script:
    - python app/etl/01_extract_transform_load_csv.py

run_tests:
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest tests/ -v

deploy:
  stage: deploy
  script:
    # RENDER_DEPLOY_HOOK = masked CI/CD variable (Settings > CI/CD > Variables)
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
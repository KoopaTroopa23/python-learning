image: python:3.11

stages:
  - extract
  - test
  - build
  - deploy

run_etl:
  stage: extract
  script:
    - python app/etl/01_extract_transform_load_csv.py

run_tests:
  stage: test
  script:
    - pip install -r requirements.txt
    - pytest tests/ -v

build_image:
  stage: build
  image: docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
  script:
    - docker build -t python-learning:$CI_COMMIT_SHORT_SHA .
    # Smoke test: the app must import and start inside the image
    - docker run --rm python-learning:$CI_COMMIT_SHORT_SHA python -c "import app.api.main; print('image OK')"

deploy:
  stage: deploy
  script:
    # RENDER_DEPLOY_HOOK = masked CI/CD variable (Settings > CI/CD > Variables)
    - curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"